name: FSC Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build FSC Modules
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fsc_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fsc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Build and install Common
        working-directory: supply-chain-common-operations/supply-chain-common-operations
        run: mvn -B clean install

      - name: Build and verify SLO
        working-directory: supplier-lifecycle-operations
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fsc_ci
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          MAIL_USERNAME: ci@example.local
          MAIL_PASSWORD: ci-dummy-password
        run: mvn -B clean verify

      - name: Build and verify SPO
        working-directory: sourcing-and-procurement-operations
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fsc_ci
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn -B clean verify