spring.application.name=supplier-lifecycle-operations
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/fsc_flyway_test
spring.datasource.username=postgres
spring.datasource.password=root@12345
spring.jpa.hibernate.ddl-auto=validate

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

fsc.bootstrap.internal-admin.enabled=true
fsc.bootstrap.internal-admin.email=fsc.admin@demo.local
fsc.bootstrap.internal-admin.password=Admin@Demo123