spring.application.name=sourcing-and-procurement-operations
server.port=8081
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fsc_flyway_test}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:root@12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Internal admin bootstrap
fsc.bootstrap.internal-admin.enabled=true
fsc.bootstrap.internal-admin.email=admin@fsc.local
fsc.bootstrap.internal-admin.password=12345
spring.flyway.enabled=false;

spring.mail.host=localhost
spring.mail.port=1025


spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false